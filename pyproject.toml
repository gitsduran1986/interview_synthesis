[project]
name = "interview-synthesis"
version = "0.1.0"
description = "Turn expert interview transcripts into a cited, queryable synthesis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[anthropic]>=1.0.0",
]

[project.scripts]
# The whole pipeline. `synthesize` is kept as a short alias.
interview-synthesis = "interview_synthesis.cli:main"
synthesize = "interview_synthesis.cli:main"
# Individual passes, for running or evaluating one stage at a time.
context-pass = "interview_synthesis.context.cli:main"
code-pass = "interview_synthesis.coding.cli:main"
synth-pass = "interview_synthesis.synthesis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_synthesis"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]
exclude = ["out/", "raw/", "structured/", "dist/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
